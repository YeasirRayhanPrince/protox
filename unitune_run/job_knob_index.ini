[database]
dbtype = postgres
host = 127.0.0.1
port = 5492
user = admin
passwd = password
dbname = benchbase
cnf = /mnt/protox/pg15/bin/pgdata5492/postgresql.conf
postgres = /mnt/protox/pg15/bin
benchbase = /mnt/protox/benchbase
knob_config_file = /proj/pmoss-PG0/protox/unitune/UniTune/knob_configs/postgres.json
knob_num = 61
workload_name = JOB
workload_timeout = 900
per_query_timeout = on
parallel_query_eval = off
parallel_max_workers = 0
workload_qlist_file = /proj/pmoss-PG0/protox/queries/job_full/qorder.txt
workload_qdir = /proj/pmoss-PG0/protox/queries/job_full/
q_mv_file = 1
mv_trainset_dir = 2
benchbase_config = /proj/pmoss-PG0/protox/stub_benchbase.xml

[tune]
task_id = gendba_job_knob_index
# 'query' (LearnedRewrite) and 'view' (AutoView) need a JVM + Maven, which this node
# does not have; they are stubbed in scripts/gendba/unitune_patches.py and excluded.
components = {'knob': 'OtterTune', 'index':'DBA-Bandit'}
tuning_budget = 14400
sub_budget = 900
context = True
context_type = im
context_pca_components = 5
output_file = /proj/pmoss-PG0/protox/unitune_run/logs/job_knob_index.res
index_budget = 20000
# Thompson sampling over per-arm Beta posteriors -- this is the meta-decision we harvest
arm_method = ts
ts_use_window = True
window_size = 7
cost_aware = True
max_runs = 1000
block_runs = 2
init_runs = 6
converage_judge = False
test = False
knob_ddpg = False
batch_size = 8
hidden_layers = 1
hidden_units = 16
verbose = 2
